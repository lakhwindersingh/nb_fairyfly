services:
  tree-sitter-daemon:
    build:
      context: ../../../
      dockerfile: workplace/infra/docker/Dockerfile.tree_sitter_daemon
    image: percipience/tree-sitter-daemon:latest
    container_name: percipience-tree-sitter-daemon
    ports:
      - "8585:8585"
    environment:
      - PERCIPIENCE_DAEMON_HOST=0.0.0.0
      - PERCIPIENCE_DAEMON_PORT=8585
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:8585/health"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - percipience-net

  portal:
    build:
      context: ../../../
      dockerfile: workplace/infra/docker/Dockerfile.portal
    image: percipience/portal:latest
    container_name: percipience-portal
    ports:
      - "3000:3000"
    environment:
      - PORTAL_HOST=0.0.0.0
      - PERCIPIENCE_DAEMON_URL=http://tree-sitter-daemon:8585
    depends_on:
      tree-sitter-daemon:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:3000/api/health"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - percipience-net

  test-runner:
    build:
      context: ../../../
      dockerfile: workplace/infra/docker/Dockerfile.test_runner
    image: percipience/test-runner:latest
    container_name: percipience-test-runner
    volumes:
      - ../../../:/workspace:rw
    environment:
      - PORTAL_URL=http://portal:3000
      - PERCIPIENCE_DAEMON_URL=http://tree-sitter-daemon:8585
    depends_on:
      portal:
        condition: service_healthy
      tree-sitter-daemon:
        condition: service_healthy
    profiles:
      - test
    networks:
      - percipience-net

  agent-runner:
    build:
      context: ../../../
      dockerfile: workplace/infra/docker/Dockerfile.agent_runner
    image: percipience/agent-runner:latest
    container_name: percipience-agent-runner
    environment:
      - PERCIPIENCE_DAEMON_URL=http://tree-sitter-daemon:8585
    profiles:
      - agent
    networks:
      - percipience-net

  fleet-agent-1:
    build:
      context: ../../../
      dockerfile: workplace/infra/docker/Dockerfile.portal
    image: percipience/portal:latest
    container_name: percipience-fleet-agent-1
    environment:
      - PORTAL_URL=http://portal:3000
    depends_on:
      portal:
        condition: service_healthy
    entrypoint: ["python3", ".nb/bin/percipience-agent", "--portal", "http://portal:3000", "--simulate", "--interval", "4", "--org", "org_enterprise", "--project", "proj_docker_swarm"]
    profiles:
      - fleet
      - swarm
    networks:
      - percipience-net

  fleet-agent-2:
    build:
      context: ../../../
      dockerfile: workplace/infra/docker/Dockerfile.portal
    image: percipience/portal:latest
    container_name: percipience-fleet-agent-2
    environment:
      - PORTAL_URL=http://portal:3000
    depends_on:
      portal:
        condition: service_healthy
    entrypoint: ["python3", ".nb/bin/percipience-agent", "--portal", "http://portal:3000", "--simulate", "--interval", "6", "--org", "org_enterprise", "--project", "proj_billing"]
    profiles:
      - fleet
      - swarm
    networks:
      - percipience-net

networks:
  percipience-net:
    driver: bridge
