<header class="showcase-header">
  <div style="display: flex; align-items: center; gap: var(--space-2);">
    <button class="hamburger-btn" onclick="toggleMobileDrawer()" title="Open Navigation Menu">☰</button>
    <div class="brand-wrap" style="cursor: pointer;" onclick="switchSurface('corporate')">
      <div class="logo-badge">⚡</div>
      <div>
        <div class="brand-title">Neutron Binary Percipience</div>
        <div class="brand-sub">Unified Enterprise Architecture &amp; Operations Portal</div>
      </div>
    </div>
  </div>

  <div class="controls-bar">
    <!-- Desktop Surface Switcher Tabs -->
    <div class="desktop-surface-tabs" style="display: flex; background-color: var(--surface-subtle); padding: 2px; border-radius: var(--radius-md); border: 1px solid var(--border-subtle); gap: 2px;">
      <button class="btn btn-xs btn-secondary surface-tab active" id="surfaceTabCorporate" onclick="switchSurface('corporate')">🌐 Corporate</button>
      <button class="btn btn-xs btn-secondary surface-tab" id="surfaceTabAdmin" onclick="switchSurface('admin')">🛡️ Admin Portal</button>
    </div>

    <!-- Core Portal Tabs -->
    <nav class="nav" style="margin-left: var(--space-1); margin-right: var(--space-1);">
      <button class="nav-btn" onclick="showTab('overview')">Overview</button>
      <button class="nav-btn" onclick="showTab('platform')">52 Capabilities</button>
      <button class="nav-btn" onclick="showTab('economics')">Economics</button>
      <button class="nav-btn" onclick="showTab('comparatives')">Comparatives</button>
      <button class="nav-btn" onclick="showTab('lab')">Lab</button>
      <button class="nav-btn" onclick="showTab('resources')">Resources</button>
      <button class="nav-btn" onclick="showTab('client')" id="clientNavBtn" style="border: 1px solid var(--cyan); color: var(--cyan); font-weight: 700;">🔑 Client Space</button>
    </nav>

    <!-- Theme Selector (3 Presets) -->
    <select id="themeSelector" class="input input-sm" style="width: 140px;" onchange="switchTheme(this.value)">
      <option value="corporate-light">Corporate Light</option>
      <option value="enterprise-dark">Enterprise Dark</option>
      <option value="pro-oled">Pro OLED</option>
    </select>

    <!-- 60 FPS Telemetry Toggle -->
    <button id="tickSimBtn" class="btn btn-sm btn-secondary" onclick="toggleTickSimulation()" title="Toggle Real-Time 60 FPS Telemetry Simulation">
      <span id="simIndicator" style="width: 8px; height: 8px; border-radius: 50%; background: var(--green); display: inline-block;"></span>
      <span style="font-size: 11px; font-weight: 700;">60 FPS Telemetry</span>
    </button>
  </div>
</header>
