syntax = "proto3";

package neutronbinary.percipience.iot;

message SensorTelemetryPacket {
  string device_id = 1;
  int64 timestamp_epoch_ms = 2;
  float temperature_celsius = 3;
  float relative_humidity_percent = 4;
  float battery_level_percent = 5;
  uint32 sequence_number = 6;
}

message DeviceCommandRequest {
  string command_id = 1;
  string action = 2;
  bytes payload = 3;
}
