metadata:
  agent_id: agent_test_perf_guard
  name: Test Perf Guard
  version: 1.0.0
  category: cicd_quality
  created_at: '2026-09-15T22:02:58.605504+00:00'
  author: Autonomous Platform Engineer
  description: Autonomous CI/CD agent specialist for cicd_quality and invariant enforcement.
model_profile:
  model: claude-3-5-sonnet-20241022
  temperature: 0.1
  role: Performance & Latency Guard
  context_budget_tokens: 12000
  cache_prefix_alignment: true
isolation_and_sandboxing:
  worktree_isolation: true
  default_ttl_seconds: 300
  clean_worktree_on_exit: true
  prevent_cross_module_leakage: true
module_scope:
  allowed_modules:
  - workplace/core
  - workplace/modules/mod_portal_marketing
  denied_paths:
  - context/invariants
  - .git
  - .workspaces
contracts_and_invariants:
  enforce_tiered_hierarchy: true
  target_contracts:
  - context/contracts/contract_schema_v2.json
  min_maturity_threshold: 0.85
tools_and_capabilities:
- name: read_ast_skeleton
  handler: workplace/core/ast_optimizer.py
- name: track_token_savings
  handler: workplace/core/token_tracker.py
- name: validate_invariants
  handler: workplace/core/layered_context_validator.py
- name: quarantine_anomaly
  handler: workplace/core/poisoning_sentinel.py
autonomous_cicd_hooks:
  auto_trigger_in_cicd: true
  target_workflows:
  - workflow_id: wf_pr_gatekeeper
    insertion_point: after:step_contract_compat
    step_id: step_test_perf_guard
    step_name: Run Test Perf Guard Step
    fail_action: AUTO_HEAL_OR_ROLLBACK
  bounded_sla:
    max_retries: 3
    timeout_seconds: 60
    allow_hypothesis_patching: true
cryptographic_governance:
  seal_merkle_block_on_success: true
  merkle_action_label: AGENT_PLUGIN_VERIFIED (agent_test_perf_guard)
  recovery_point_prefix: RP_AGENT_TEST_PERF_GUARD
  rollback_policy:
    enabled: true
    fallback_recovery_point: RP_PLAY3_BOOTSTRAP_001
    target_module: mod_portal_marketing
    auto_isolate_on_poisoning: true
    quarantine_file: user/hitl/poisoning_quarantine.md
system_prompt: You are the Performance & Latency Guard for this workspace. Enforce
  quality, contracts, and zero context leakage.
