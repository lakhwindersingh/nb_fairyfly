[workspace]
resolver = "2"
members = [
    "workplace/crates/percipience-core",
    "workplace/crates/percipience-security",
    "workplace/crates/percipience-orchestrator",
    "workplace/crates/percipience-packager",
    "workplace/crates/percipience-server",
    "workplace/crates/percipience-lsp",
    "workplace/crates/percipience-cli",
]

[workspace.package]
version = "3.0.0"
edition = "2021"
authors = ["Neutron Binary Percipience Architecture Group"]
license = "Apache-2.0"

[workspace.dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"
tokio = { version = "1.38", features = ["full"] }
clap = { version = "4.5", features = ["derive", "env"] }
sha2 = "0.10"
hmac = "0.12"
hex = "0.4"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1.8", features = ["v4", "serde"] }
anyhow = "1.0"
thiserror = "1.0"
tracing = "0.1"
tracing-subscriber = "0.3"
tempfile = "3.10"
axum = "0.7"
tower = { version = "0.4", features = ["util"] }
tower-http = { version = "0.5", features = ["cors", "trace"] }
