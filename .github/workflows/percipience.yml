name: "Neutron Binary Percipience Gatekeeper & Token Savings Metering"
on:
  pull_request:
    types: [opened, synchronize]
  push:
    branches: [main]

jobs:
  percipience-verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Runtime Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyyaml

      - name: Run Percipience PR Gatekeeper & AST Token Pruning
        run: |
          chmod +x .nb/bin/percipience
          ./.nb/bin/percipience gate
          ./.nb/bin/percipience tokens summary

      - name: Enforce Merkle Chain Continuity & Context Maturity
        run: |
          ./.nb/bin/percipience audit --enforce-merkle-chain --min-maturity 0.85

      - name: Validate Layered Context Hierarchy & Invariants
        run: |
          ./.nb/bin/percipience validate --layered

      - name: Post Reports to GitHub Actions Step Summary
        if: always()
        run: |
          if [ -f user/outputs/token_savings_report.md ]; then
            echo "## ⚡ Percipience Token Savings Summary" >> $GITHUB_STEP_SUMMARY
            cat user/outputs/token_savings_report.md >> $GITHUB_STEP_SUMMARY
          fi
          if [ -f user/outputs/context_maturity_report.md ]; then
            echo "## 🛡️ Context Maturity Scorecard" >> $GITHUB_STEP_SUMMARY
            cat user/outputs/context_maturity_report.md >> $GITHUB_STEP_SUMMARY
          fi

      - name: Upload Percipience Verification Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: percipience-gate-reports
          path: |
            user/outputs/token_savings_report.md
            user/outputs/context_maturity_report.md
            context/ledger/token_savings_ledger.yaml
            context/ledger/context_ledger.yaml
