workflow_id: wf_enterprise_pr_gate
name: Enterprise PR Gate with Custom Infosec & FinOps Audit
description: Demonstrates hybrid composition of sealed platform executors with customer
  custom agents.
steps:
- step_id: ast_prune
  id: ast_prune
  name: Structural AST Token Pruner
  executor: platform.ast_pruner
  inputs:
  - workplace/
  handled_contracts:
  - contract_id: psi_ast_bridge_contract
    name: Structural AST Bridge & Token Slicing Contract
    path: .nb/context/contracts/psi_ast_bridge_contract.yaml
    type: yaml_schema
    action: prune_ast
    description: Extracts function declarations and docstrings while pruning implementation blocks to maximize prompt cache hits.

- step_id: token_savings_audit
  id: token_savings_audit
  name: Autonomous Token FinOps & Metering Verification
  executor: agent_token_finops_auditor
  depends_on:
  - ast_prune
  inputs:
  - .nb/context/ledger/token_savings_ledger.yaml
  failure_action: warn_and_meter
  handled_contracts:
  - contract_id: billing_meter_contract
    name: Token Savings FinOps Metering Contract
    path: .nb/context/contracts/billing_meter_contract.yaml
    type: yaml_schema
    action: audit_metering
    description: Verifies cumulative token savings, calculates USD economic value, and compares against billing tier ceilings.

- step_id: custom_security_audit
  id: custom_security_audit
  name: Enterprise Infosec & Banking Rule Audit
  executor: agent_security_auditor
  depends_on:
  - token_savings_audit
  inputs:
  - workplace/
  - .nb/context/custom/rules/banking_security.md
  failure_action: quarantine_and_pause
  handled_contracts:
  - contract_id: security_rebac_policy_contract
    name: Relationship-Based Access Control (ReBAC) Contract
    path: .nb/context/contracts/security_rebac_policy_contract.json
    type: json_schema
    action: audit_policy
    description: Verifies multi-tenant graph relationships and enterprise access boundaries.
  - contract_id: security_pii_vault_contract
    name: PII Vault & Data Protection Contract
    path: .nb/context/contracts/security_pii_vault_contract.json
    type: json_schema
    action: inspect_payload
    description: Scans payloads for unredacted sensitive tokens, cryptographic secrets, or customer PII.

- step_id: contract_verification
  id: contract_verification
  name: Cross-Module Schema Verification
  executor: platform.contract_verifier
  depends_on:
  - custom_security_audit
  inputs:
  - .nb/context/contracts/
  - .nb/context/custom/schemas/
  handled_contracts:
  - contract_id: portal_openapi_spec
    name: OpenAPI 3.1 REST Wire Specification Contract
    path: .nb/context/contracts/portal_openapi_spec.yaml
    type: openapi_spec
    action: verify_endpoints
    description: Enforces backward compatibility, schema validation, and route invariants across all exposed REST endpoints.
  - contract_id: rbac_permission_matrix
    name: Cross-Module RBAC Matrix Contract
    path: .nb/context/contracts/rbac_permission_matrix.json
    type: json_schema
    action: verify_matrix
    description: Validates access scopes across modules to prevent privilege escalation.

- step_id: merkle_seal
  id: merkle_seal
  name: Merkle State DAG Block Sealer
  executor: platform.merkle_ledger
  depends_on:
  - contract_verification
  action: SEAL_BLOCK
  handled_contracts:
  - contract_id: security_four_eyes_contract
    name: Cryptographic Four-Eyes Merkle Seal Contract
    path: .nb/context/contracts/security_four_eyes_contract.json
    type: json_schema
    action: seal_dag_block
    description: Validates dual cryptographic signoffs before sealing the state transition block into the immutable Merkle DAG.
