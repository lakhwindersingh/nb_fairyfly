workflow_id: basic_autonomous_cicd
name: "Free Community Autonomous CI/CD Pipeline"
version: 2.1.0
description: "Watered-down autonomous CI/CD workflow providing maintenance, AST token compression, basic bounded self-repair, and Merkle block sealing for the Free Plan."

steps:
  - id: sustain_maintenance
    step_id: sustain_maintenance
    name: "Self-Sustaining Workspace Hygiene"
    agent: platform.self_sustaining_engine
    executor: platform.self_sustaining_engine
    description: "Reclaim dead POSIX leases and purge orphaned scratch artifacts"
    depends_on: []
    input_artifacts:
      - art_workspace_scratch_dir
    output_artifacts:
      - art_hygiene_maintenance_receipt
    failure_action: warn_and_continue

  - id: ast_token_reduction
    step_id: ast_token_reduction
    name: "AST Token Skeletonization & Attention Budgeting"
    agent: platform.ast_pruner
    executor: platform.ast_pruner
    description: "Extract AST skeletons and compute token compression ratios"
    depends_on:
      - sustain_maintenance
    input_artifacts:
      - art_hygiene_maintenance_receipt
    output_artifacts:
      - art_ast_skeleton_cache
    failure_action: warn_and_continue

  - id: contract_and_test_gate
    step_id: contract_and_test_gate
    name: "Basic Contract & Test Verification"
    agent: platform.contract_verifier
    executor: platform.contract_verifier
    description: "Validate wire contracts and execute regression test suite"
    depends_on:
      - ast_token_reduction
    input_artifacts:
      - art_ast_skeleton_cache
    output_artifacts:
      - art_contract_test_receipt
    verification_gate: gate_contracts_and_unit_tests
    failure_action: AUTO_HEAL_OR_ROLLBACK

  - id: bounded_auto_heal
    step_id: bounded_auto_heal
    name: "Basic Single-Attempt Self-Healing"
    agent: platform.autonomous_healer
    executor: platform.autonomous_healer
    description: "Attempt bounded single-pass hypothesis repair on failure"
    depends_on:
      - contract_and_test_gate
    input_artifacts:
      - art_contract_test_receipt
    output_artifacts:
      - art_auto_heal_receipt
    config:
      max_retries: 1
      fallback: quarantine_and_notify
    failure_action: quarantine_and_notify

  - id: merkle_state_seal
    step_id: merkle_state_seal
    name: "Cryptographic Merkle State Block Seal"
    agent: platform.merkle_ledger
    executor: platform.merkle_ledger
    description: "Commit verified block to cryptographic Merkle ledger"
    depends_on:
      - bounded_auto_heal
    input_artifacts:
      - art_contract_test_receipt
      - art_auto_heal_receipt
    output_artifacts:
      - art_merkle_pipeline_receipt
    action: SEAL_BLOCK
    failure_action: warn_and_continue
