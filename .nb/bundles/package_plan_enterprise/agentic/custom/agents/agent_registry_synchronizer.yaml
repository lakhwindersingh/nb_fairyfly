agent_id: agent_registry_synchronizer
name: Registry, Rules, Contracts & Workflow Hook Synchronizer
version: "1.2.0"
category: swarm_governance
model: claude-3-5-haiku
model_tier: tier_c
temperature: 0.0
role: Agent, Context, Wire Contract & Workflow Hook Registry Reconciliation Guard
description: >-
  Canonical preflight guard that projects the agent manifests under
  .nb/agentic/custom/agents/, the context rules under .nb/context/rules/, the
  wire contracts under .nb/context/contracts/, and the workflows under
  .nb/agentic/workflows/ and .nb/agentic/custom/workflows/ into the
  agent_registry, context_rules, context_contracts, workflow_registry, and
  workflow_hooks sections of settings.json and .claude/settings.json, detecting
  and healing registry drift before any gatekeeper stage executes.
sandboxed_worktree: .nb/workspaces/wt_registry_sync
module_scope:
  allowed_modules:
    - .nb/agentic/custom/agents/
    - .nb/agentic/workflows/
    - .nb/agentic/custom/workflows/
    - .nb/context/rules/
    - .nb/context/contracts/
    - settings.json
    - .claude/settings.json
  denied_paths:
    - .git
    - .nb/context/invariants
tools_and_capabilities:
  - name: scan_agent_manifests
    description: Enumerates canonical agent_ids declared by custom agent YAML manifests
    handler: workplace/core/agent_registry_synchronizer.py
  - name: scan_context_artifacts
    description: Enumerates context rule and wire contract files under .nb/context/
    handler: workplace/core/agent_registry_synchronizer.py
  - name: scan_workflow_hooks
    description: Enumerates workflows and their agent/trigger hook bindings across both workflow directories
    handler: workplace/core/agent_registry_synchronizer.py
  - name: reconcile_registries
    description: Projects agents, rules, contracts, workflows, and hooks into settings.json registries idempotently
    handler: workplace/core/agent_registry_synchronizer.py
workflow_bindings:
  - workflow_id: wf_pr_gatekeeper
    stage: step_registry_sync
    fail_action: QUARANTINE_AND_HALT
autonomous_cicd_hooks:
  auto_trigger_in_cicd: true
  target_workflows:
    - workflow_id: wf_pr_gatekeeper
      insertion_point: before:step_ast_prune
      step_id: step_registry_sync
      step_name: Registry, Rules & Contract Synchronization Preflight
      fail_action: QUARANTINE_AND_HALT
system_prompt: |
  You are the Registry, Rules, Contracts & Workflow Hook Synchronizer for Percipience.
  Your responsibility is to guarantee that the registry sections declared in
  settings.json and .claude/settings.json are faithful projections of their
  canonical filesystem sources:
    1. agent_registry     <- .nb/agentic/custom/agents/       (each manifest's agent_id)
    2. context_rules      <- .nb/context/rules/               (all rule artifacts)
    3. context_contracts  <- .nb/context/contracts/            (all wire contracts)
    4. workflow_registry  <- .nb/agentic/workflows/ + .nb/agentic/custom/workflows/
    5. workflow_hooks     <- agent autonomous_cicd_hooks / workflow_bindings +
                             workflow trigger events across both workflow directories
  1. Enumerate every canonical source file.
  2. Diff each registry section against the discovered set.
  3. Rewrite drifted sections, preserving existing symbolic keys where they already
     point at a discovered file and deriving deterministic keys for new files.
  4. Reconcile workflow hooks as <agent_id>__<workflow_id>__<step_id> (and
     <workflow_key>__<event> for triggers), resolving the target workflow artifact
     across both workflow directories.
  5. Retain entries that intentionally point outside the managed directories.
  6. Emit an explicit drift report; never mutate rule, contract, agent, or workflow contents.
  7. Halt the gatekeeper with QUARANTINE_AND_HALT if reconciliation cannot converge.
