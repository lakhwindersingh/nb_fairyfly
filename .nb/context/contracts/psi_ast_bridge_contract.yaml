$schema: "http://json-schema.org/draft-07/schema#"
title: "PsiAstBridgeContract"
description: "PSI symbol extraction schema and real-time token calculation interfaces for JetBrains IDEs."
type: "object"
contract_id: "psi_ast_bridge_contract"
schema_version: "2.0.0"
required:
  - "supported_languages"
  - "performance_targets"
properties:
  supported_languages:
    type: "array"
    items:
      type: "object"
      required: ["id", "psi_root", "prunable_elements"]
      properties:
        id:
          type: "string"
        psi_root:
          type: "string"
        prunable_elements:
          type: "array"
          items:
            type: "string"
  performance_targets:
    type: "object"
    required: ["max_psi_traversal_ms", "max_memory_per_file_kb", "min_token_reduction_ratio"]
    properties:
      max_psi_traversal_ms:
        type: "integer"
      max_memory_per_file_kb:
        type: "integer"
      min_token_reduction_ratio:
        type: "number"
supported_languages:
  - id: "python"
    psi_root: "com.jetbrains.python.psi.PyFile"
    prunable_elements: ["PyFunction", "PyClass", "PyDocStringExpression"]
  - id: "kotlin"
    psi_root: "org.jetbrains.kotlin.psi.KtFile"
    prunable_elements: ["KtNamedFunction", "KtClass", "KtProperty"]
  - id: "java"
    psi_root: "com.intellij.psi.PsiJavaFile"
    prunable_elements: ["PsiMethod", "PsiClass"]
performance_targets:
  max_psi_traversal_ms: 35
  max_memory_per_file_kb: 512
  min_token_reduction_ratio: 0.60
