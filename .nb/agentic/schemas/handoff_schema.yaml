$schema: "http://json-schema.org/draft-07/schema#"
title: "PercipienceInterAgentHandoffPayload"
type: "object"
required:
  - "handoff_id"
  - "from_agent"
  - "to_agent"
  - "workflow_id"
  - "stage"
  - "payload_artifact"
  - "token_hash"
  - "timestamp"
properties:
  handoff_id:
    type: "string"
    pattern: "^HO_[A-Za-z0-9_\\-]+$"
  from_agent:
    type: "string"
  to_agent:
    type: "string"
  workflow_id:
    type: "string"
  stage:
    type: "string"
  payload_artifact:
    type: "string"
  token_hash:
    type: "string"
    pattern: "^[a-f0-9]{64}$"
  timestamp:
    type: "string"
    format: "date-time"
  parity_receipt_hash:
    type: "string"
    description: "SHA-256 hash of confirmed Anti-Drift Parity Report (S_sp >= 0.95)"
  artifact_hash:
    type: "string"
    description: "SHA-256 content hash of the payload artifact"
  nonce:
    type: "string"
    description: "Cryptographic single-use nonce for replay protection"
  hop_count:
    type: "integer"
    minimum: 0
    maximum: 10
    description: "Current swarm execution hop counter (MAX_HOP_COUNT = 5)"
  lineage:
    type: "array"
    items:
      type: "string"
    description: "Ordered sequence of previously visited agent IDs"
  ttl_seconds:
    type: "integer"
    description: "Time-to-live for handoff delivery in seconds"
  metadata:
    type: "object"
    additionalProperties: true
additionalProperties: false
