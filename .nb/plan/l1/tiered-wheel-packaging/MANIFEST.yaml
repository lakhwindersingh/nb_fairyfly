dependencies:
  requires:
  - master_parent_framework
  enables: []
key_capabilities:
- Automated Multi-Tier Rust Static Binary Compilation (Free, Team, Business, Enterprise)
- Build-Time Feature Gating via Cargo Features (#[cfg(feature = "enterprise")])
- Universal Cross-Platform Targets (macOS aarch64/x86_64, Linux musl, Windows .exe)
- Self-Contained Asset Embedding via rust-embed (< 15MB Static Binary)
- SHA-256 Merkle Block Sealing for Built Binary and Crate Artifacts
- Optional Polyglot PyO3/maturin Wheels and NAPI Node.js Modules
- Automated Distribution via GitHub Releases, crates.io, and Private Registries
autonomous_execution:
  orchestrator_agent: agent_sequential_plan_orchestrator
  specialist_agent: agent_packaging_release_engineer
  execution_engine: dynamic_dag
  worktree_isolation: true
  max_healing_loops: 3
  handoff_protocol: hmac_sha256_attested
  anti_drift_gate: true
  finops_metering: true
lifecycle_hooks:
  pre_spawn: percipience worktree lease --module l1_wheel_packaging
  pre_execution: percipience check --ast-prune --schema-lint
  post_execution: cargo test -p percipience-packager
  handover: percipience handoff issue --from agent_packaging_release_engineer --to
    agent_qa_sentinel
  pre_merge_gate: percipience gate
  self_healing: percipience heal --max-attempts 3
  post_merge_seal: percipience merkle seal --worm-egress
specification_contracts:
  wire_contracts:
  - path: .nb/context/contracts/wheel_tier_spec_contract.yaml
    type: RPC_OR_EVENT_STREAM
    strict_mode: true
  - path: .nb/context/contracts/wheel_attestation_schema.json
    type: STATE_TELEMETRY
    strict_mode: true
  invariant_rules:
  - path: .nb/context/rules/licensing_boundary_invariants.md
    type: ARCHITECTURAL_BOUNDARIES
  - path: .nb/context/rules/wheel_signing_attestations.md
    type: PERFORMANCE_AND_SECURITY
