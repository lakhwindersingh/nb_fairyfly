stages:
  - verify

percipience_gatekeeper:
  stage: verify
  image: python:3.11-slim
  variables:
    PERCIPIENCE_API_URL: "https://percipience.corp.internal/api/v1"
    GIT_DEPTH: "0"
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH == "main"'
  before_script:
    - pip install pyyaml
    - chmod +x workplace/bin/percipience
  script:
    - echo "Running Percipience Gatekeeper, AST Token Metering & Merkle State Audit..."
    - ./workplace/bin/percipience gate
    - ./workplace/bin/percipience tokens summary
    - ./workplace/bin/percipience audit --enforce-merkle-chain --min-maturity 0.85
    - ./workplace/bin/percipience validate --layered
  artifacts:
    when: always
    paths:
      - workplace/docs/reports/token_savings_report.md
      - workplace/docs/reports/context_maturity_report.md
      - .nb/context/ledger/token_savings_ledger.yaml
