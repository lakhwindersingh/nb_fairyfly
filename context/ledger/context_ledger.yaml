ledger_version: 7.2.0
project:
  name: nb_fairyfly
  mode: multi_module
  framework: Neutron Binary Percipience
  description: Enterprise Context Engineering OS & Multi-Module Cloud SaaS Portal
  governing_plan: .nb/plan/claude-context-engineering-parent-master-plan.md
  associated_play: .nb/play/CEaasS/play_3_corp_site_saas_portal_plan.md
mcp_integrations:
  jira:
    enabled: true
    server_package: '@modelcontextprotocol/server-jira'
    endpoint: https://neutronbinary.atlassian.net
    auth_secret_arn: arn:aws:secretsmanager:us-east-1:123456789012:secret/jira-api-token
    jql_query: project = PERC AND status = 'Ready for Dev' AND labels = 'percipience-ready'
    poll_interval_seconds: 300
    auto_transition:
      on_start: In Progress
      on_verify_pass: Done
      on_hitl_quarantine: Needs HITL Review
    attach_maturity_report: true
    attach_merkle_proof: true
modules:
  mod_portal_marketing:
    name: Corporate Marketing & MDX Docs
    path: workplace/modules/mod_portal_marketing
    status: BOOTSTRAPPED
    contract_dependencies: []
  mod_tenant_onboarding:
    name: Self-Serve Onboarding & CMEK Provisioner
    path: workplace/modules/mod_tenant_onboarding
    status: BOOTSTRAPPED
    contract_dependencies:
    - context/contracts/onboarding_contract.yaml
  mod_billing_metering:
    name: Stripe Billing & 15% Token Rev-Share Engine
    path: workplace/modules/mod_billing_metering
    status: BOOTSTRAPPED
    contract_dependencies:
    - context/contracts/billing_meter_contract.yaml
  mod_observability_usage:
    name: Live Merkle Explorer & Telemetry UI
    path: workplace/modules/mod_observability_usage
    status: BOOTSTRAPPED
    contract_dependencies:
    - context/contracts/observability_contract.yaml
  mod_shared_infra_bridge:
    name: Shared-to-Decoupled Infrastructure Adapter
    path: workplace/modules/mod_shared_infra_bridge
    status: BOOTSTRAPPED
    contract_dependencies: []
contracts:
- id: CTR_ONBOARDING_V1
  file: context/contracts/onboarding_contract.yaml
  version: 1.0.0
  status: VALID
- id: CTR_BILLING_METER_V1
  file: context/contracts/billing_meter_contract.yaml
  version: 1.0.0
  status: VALID
- id: CTR_OBSERVABILITY_V1
  file: context/contracts/observability_contract.yaml
  version: 1.0.0
  status: VALID
